<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <title>Travel Agent — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f9fafb;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 24rem;
    }
    .icon {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.5rem;
      background: #eff6ff;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 2rem; height: 2rem; color: #2563eb; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; color: #1d4ed8; }
    p { font-size: 0.875rem; color: #6b7280; line-height: 1.5; margin-bottom: 1.5rem; }
    button {
      padding: 0.75rem 1.5rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      min-height: 44px;
    }
    button:active { background: #1d4ed8; }
    .cached-trips {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e5e7eb;
      text-align: left;
    }
    .cached-trips h2 { font-size: 0.75rem; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
    .trip-item {
      padding: 0.75rem;
      background: white;
      border-radius: 0.5rem;
      border: 1px solid #e5e7eb;
      margin-bottom: 0.5rem;
      font-size: 0.8125rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728M5.636 18.364a9 9 0 010-12.728m12.728 0L5.636 18.364" />
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>Travel Agent needs an internet connection to plan trips. Your existing trip data is cached and will be available when you reconnect.</p>
    <button onclick="window.location.reload()">Try Again</button>
    <div class="cached-trips" id="cached-section" style="display:none">
      <h2>Cached Trips</h2>
      <div id="cached-list"></div>
    </div>
  </div>
  <script>
    // Show cached trip data from the API cache if available
    if ("caches" in window) {
      caches.open("apis").then(function(cache) {
        cache.match("/api/trips").then(function(response) {
          if (!response) return;
          response.json().then(function(trips) {
            if (!trips || !trips.length) return;
            var section = document.getElementById("cached-section");
            var list = document.getElementById("cached-list");
            section.style.display = "block";
            trips.slice(0, 5).forEach(function(t) {
              var div = document.createElement("div");
              div.className = "trip-item";
              div.textContent = t.goal || t.id;
              list.appendChild(div);
            });
          });
        });
      });
    }
  </script>
</body>
</html>
