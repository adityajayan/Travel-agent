<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#f8f5ef" />
  <title>Concierge — Offline</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Syne:wght@600;700&family=DM+Sans:wght@300;400&display=swap" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "DM Sans", system-ui, sans-serif;
      background: #f8f5ef;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 24rem;
    }
    .mark {
      width: 3rem;
      height: 3rem;
      margin: 0 auto 1.5rem;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .mark span {
      font-family: "Playfair Display", Georgia, serif;
      color: #f8f5ef;
      font-size: 1.5rem;
      font-weight: 500;
    }
    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      color: #1a1a1a;
    }
    p {
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 0.88rem;
      color: #777;
      line-height: 1.65;
      font-weight: 300;
      margin-bottom: 1.5rem;
    }
    button {
      padding: 0.7rem 1.5rem;
      background: #1a1a1a;
      color: #f8f5ef;
      border: none;
      font-family: "Syne", system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      min-height: 44px;
      transition: background 0.25s;
    }
    button:hover { background: #c0392b; }
    button:active { background: #a5311f; }
    .cached-trips {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 2px solid #1a1a1a;
      text-align: left;
    }
    .cached-trips h2 {
      font-family: "Syne", system-ui, sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      color: #c0392b;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .cached-trips h2::before {
      content: '';
      width: 24px;
      height: 3px;
      background: #c0392b;
      flex-shrink: 0;
    }
    .trip-item {
      padding: 0.75rem;
      background: white;
      border: 2px solid #1a1a1a;
      margin-bottom: 0.5rem;
      font-size: 0.8125rem;
      font-family: "DM Sans", system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="mark"><span>C</span></div>
    <h1>You&rsquo;re Offline</h1>
    <p>Concierge needs an internet connection to plan trips. Your existing trip data is cached and will be available when you reconnect.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
    <div class="cached-trips" id="cached-section" style="display:none">
      <h2>Cached Trips</h2>
      <div id="cached-list"></div>
    </div>
  </div>
  <script>
    if ("caches" in window) {
      caches.open("apis").then(function(cache) {
        cache.match("/api/trips").then(function(response) {
          if (!response) return;
          response.json().then(function(trips) {
            if (!trips || !trips.length) return;
            var section = document.getElementById("cached-section");
            var list = document.getElementById("cached-list");
            section.style.display = "block";
            trips.slice(0, 5).forEach(function(t) {
              var div = document.createElement("div");
              div.className = "trip-item";
              div.textContent = t.goal || t.id;
              list.appendChild(div);
            });
          });
        });
      });
    }
  </script>
</body>
</html>
